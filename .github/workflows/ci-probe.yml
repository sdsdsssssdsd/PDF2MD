name: ci-probe

# 临时探针：定位 pytest 进程退出崩溃（0xC0000409）来自哪个文件/哪条用例
on:
  push:
    branches: [main]

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=7.0"

      - name: per-file exit codes
        shell: pwsh
        env:
          CI: true
          GITHUB_ACTIONS: true
          PDF2MD_SETTINGS_FILE: ${{ runner.temp }}/pdf2md_probe.ini
        run: |
          $results = @()
          $bad = @()
          Get-ChildItem tests/test_*.py | ForEach-Object {
            $name = $_.Name
            python -m pytest $_.FullName -q *> "probe_$($name).log"
            $c = $LASTEXITCODE
            $summary = (Get-Content "probe_$($name).log" -Tail 1)
            $results += "$name exit=$c :: $summary"
            if ($c -ne 0) { $bad += $_.FullName }
          }
          Write-Host "=== per-file results ==="
          $results | ForEach-Object { Write-Host $_ }
          Write-Host "::notice title=per-file exit codes::$($results -join '%0A')"

          foreach ($file in $bad) {
            $base = [System.IO.Path]::GetFileNameWithoutExtension($file)
            $ids = (python -m pytest $file --collect-only -q 2>$null) | Where-Object { $_ -match '::' }
            $lines = @()
            foreach ($id in $ids) {
              python -m pytest $id -q *> "one.log"
              $c = $LASTEXITCODE
              if ($c -ne 0) { $lines += "$id exit=$c :: $((Get-Content one.log -Tail 1))" }
            }
            Write-Host "::notice title=bad tests in $base::$($lines -join '%0A')"
          }

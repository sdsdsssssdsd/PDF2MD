name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=7.0"

      - name: compileall
        run: python -m compileall -q app tests

      - name: Privacy scan (no local paths / secrets)
        run: python scripts/check_github_submit_privacy.py

      - name: pytest
        shell: pwsh
        run: |
          # 不用管道：管道会让 $LASTEXITCODE 不可靠，曾把一次全绿运行误判成失败
          python -m pytest -q *> pytest.log
          $code = $LASTEXITCODE
          Get-Content pytest.log -Tail 40
          Write-Host "pytest exit code: $code"
          if ($code -ne 0) {
            # 失败摘要写进 job annotation，公开仓库无需 token 也能读到
            $tail = (Get-Content pytest.log -Tail 80) -join '%0A'
            Write-Host "::error title=pytest failed (exit $code)::$tail"
            exit 1
          }
        env:
          CI: true
          GITHUB_ACTIONS: true
          # 测试绝不写真实用户配置（Windows 上是注册表），全部落到临时 INI
          PDF2MD_SETTINGS_FILE: ${{ runner.temp }}/pdf2md_ci_settings.ini
